<style>
:root{--bg:#11100f;--panel:#1b1918;--text:#f1e9df;--muted:#a99d91;--red:#bd443b;--line:#3a302c;--gold:#d5a878;--blue:#536a7d}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#3a211d 0%,#171312 36%,#0d0c0c 75%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
.shell{max-width:680px;min-height:100vh;margin:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font:10px/1.4 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px;box-shadow:0 0 13px #bd443b}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:25px 0 30px}
.frame{height:clamp(94px,26vw,145px);position:relative;overflow:hidden;border:1px solid #49332d;margin-bottom:26px;background:linear-gradient(115deg,#11100f 0%,#38211e 52%,#12100f 100%);isolation:isolate}
.frame:before{content:"";position:absolute;inset:-25%;background:repeating-linear-gradient(90deg,transparent 0 8%,rgba(255,220,182,.08) 8.2% 8.7%,transparent 9% 14%);transform:skewX(-15deg);animation:drift 14s linear infinite}
.frame:after{content:"";position:absolute;width:45%;height:200%;left:32%;top:-48%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(189,68,59,.22),transparent);filter:blur(8px)}
.frame[data-vibe="city"]{background:linear-gradient(180deg,#171b26 0%,#a45e42 57%,#1b1414 100%)}
.frame[data-vibe="train"]{background:linear-gradient(180deg,#23201e 0%,#7b4933 44%,#181210 100%)}
.frame[data-vibe="guest"]{background:linear-gradient(135deg,#65513d 0%,#25211c 37%,#0f1110 100%)}
.frame[data-vibe="kitchen"]{background:linear-gradient(135deg,#766a51 0%,#433d30 42%,#171511 100%)}
.frame[data-vibe="road"]{background:linear-gradient(175deg,#d7a06b 0%,#8c6545 26%,#44362b 57%,#161311 100%)}
.frame[data-vibe="sea"]{background:linear-gradient(175deg,#bd8c65 0%,#d2a16f 28%,#42596a 29%,#1d3542 58%,#111516 100%)}
.frame[data-vibe="tension"]{background:linear-gradient(135deg,#36221d,#141211 45%,#4b251f 100%)}
.frame[data-vibe="flight"]{background:linear-gradient(180deg,#080e1b,#16243b 46%,#bd714c 47%,#251713 75%,#090909 100%)}
.frame[data-vibe="home"]{background:linear-gradient(130deg,#25201d,#171413 50%,#301d1b)}
.frame[data-vibe="end"]{background:linear-gradient(140deg,#070707,#191413 48%,#4a1d1b 100%)}
.frame-stamp{position:absolute;bottom:11px;left:13px;z-index:1;color:#f0d8c1;font:9px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.kicker{font:10px Arial,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
h1{font-size:clamp(41px,12vw,76px);line-height:.91;letter-spacing:-.055em;margin:0 0 22px;font-weight:700}
h1 span{color:var(--red)}
h2{font-size:clamp(27px,7vw,39px);line-height:1.02;letter-spacing:-.035em;margin:0 0 20px}
p{font-size:18px;line-height:1.64;color:#ded2c7;margin:0 0 17px;white-space:pre-line}
.small{font:12px/1.6 Arial,sans-serif;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,var(--red),var(--line),transparent);margin:24px 0}
.actions{display:grid;gap:10px;margin-top:25px}
button{font:14px/1.4 Arial,sans-serif;cursor:pointer;border:1px solid #54413a;background:#211b19;color:var(--text);padding:15px 16px;text-align:left;transition:transform .15s,border-color .15s,background .15s;min-height:54px;width:100%;-webkit-tap-highlight-color:transparent}
button:hover,button:focus-visible{border-color:var(--red);background:#2b1c1a;outline:none}
button:active{transform:scale(.99)}
button.primary{background:var(--red);border-color:var(--red);font-weight:700;color:#fff;text-align:center}
button.primary:hover{background:#d05247}
button.secondary{text-align:center;background:transparent}
.choice-mark{float:right;color:var(--red);padding-left:10px}
.story-meta{display:flex;gap:15px;flex-wrap:wrap;margin-top:21px;font:10px Arial,sans-serif;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.pill{display:inline-block;border:1px solid #4c3931;padding:5px 8px;color:#cbb8a7;font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:0 0 15px}
 .note{border-left:2px solid var(--red);padding:2px 0 2px 14px;color:#b7a79a;font-size:15px;line-height:1.55;margin:18px 0}
.memory-signal{position:relative;border:1px solid rgba(105,190,255,.48);border-left:4px solid #65c7ff;border-radius:8px;padding:13px 15px 13px 16px;margin:2px 0 22px;background:linear-gradient(115deg,rgba(16,70,112,.48),rgba(13,38,62,.42) 58%,rgba(14,19,26,.98));box-shadow:inset 0 1px 0 rgba(220,244,255,.07),0 7px 22px rgba(0,0,0,.22);color:#e4f5ff;font-size:14px;line-height:1.55;font-style:italic}
.memory-signal::before{content:"ПАМЯТЬ · ";display:block;margin-bottom:5px;font:700 9px/1.4 Arial,sans-serif;letter-spacing:.2em;color:#8bd8ff;font-style:normal}
.memory-signal::after{content:"";position:absolute;right:12px;top:12px;width:6px;height:6px;border-radius:50%;background:#65c7ff;box-shadow:0 0 10px rgba(101,199,255,.72)}
.reset-link{width:auto;min-height:0;padding:0;border:0;background:transparent;color:#8f8177;font:9px/1.5 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.reset-link:hover,.reset-link:focus-visible{background:transparent;color:#e0b2a7;border:0}
.footer-right{display:flex;align-items:flex-end;flex-direction:column;gap:5px;text-align:right}
.save-hint{font:9px/1.4 Arial,sans-serif;color:#9a8175;letter-spacing:.04em;text-transform:none}

.progress{height:2px;background:#352b27;margin-top:22px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--red);transition:width .4s}
.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;font:9px/1.5 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#776c63}
.fade{animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{from{transform:translateX(-12%) skewX(-15deg)}to{transform:translateX(12%) skewX(-15deg)}}

/* Immersive details: restrained motion, tactile controls, no forced audio. */
.top{flex-wrap:wrap;row-gap:9px}
.brand-label{white-space:nowrap}
.chapter-label{margin-left:auto;text-align:right}
button.sound-toggle{width:auto;min-width:126px;min-height:30px;padding:7px 9px;border-radius:999px;border:1px solid #4a6173;background:rgba(17,28,37,.76);color:#a8dcff;text-align:center;font:700 8px/1.2 Arial,sans-serif;letter-spacing:.12em;white-space:nowrap;transition:background .25s,border-color .25s,transform .2s,box-shadow .25s}
button.sound-toggle[aria-pressed="true"]{background:rgba(30,82,116,.35);border-color:#65c7ff;box-shadow:0 0 16px rgba(101,199,255,.12)}
button.sound-toggle:active{transform:scale(.96)}
.frame{transition:filter .8s ease,background 1s ease,border-color .8s ease}
.frame:after{animation:lightSweep 10s ease-in-out infinite alternate}
.frame[data-vibe="sea"]:after{background:linear-gradient(90deg,transparent,rgba(125,204,235,.23),transparent)}
.frame[data-vibe="home"]:after{background:linear-gradient(90deg,transparent,rgba(103,162,205,.12),transparent)}
section.fade{animation:cinemaIn .72s cubic-bezier(.2,.65,.25,1) both;transform-origin:50% 45%}
section.fade .frame{animation:frameIn .9s ease both}
section.fade .kicker{animation:fadeUp .45s .05s ease both}
section.fade h1{animation:fadeUp .55s .08s ease both}
section.fade p{animation:fadeUp .55s .13s ease both}
section.fade .actions button,section.fade>button{animation:fadeUp .45s ease both}
section.fade .actions button:nth-child(2){animation-delay:.07s}
section.fade .actions button:nth-child(3){animation-delay:.12s}
.memory-signal{animation:memoryAppear .5s cubic-bezier(.18,.75,.2,1) both;overflow:hidden}
.memory-signal::after{animation:memoryPulse 2.8s ease-in-out infinite}
button{position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.2,.7,.2,1),border-color .28s,background .28s,box-shadow .28s}
button:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 0 35%,rgba(255,255,255,.055) 50%,transparent 65%);transform:translateX(-125%);transition:transform .55s ease}
button:hover:before,button:focus-visible:before{transform:translateX(125%)}
button:active{transform:scale(.985)}
button.primary{box-shadow:0 5px 20px rgba(189,68,59,.1)}
button.primary:active{box-shadow:0 2px 8px rgba(189,68,59,.12)}
.choice-mark{transition:transform .22s ease,color .22s}
button:hover .choice-mark{transform:translate(2px,-1px);color:#e4c3b2}
.progress span{position:relative;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.progress span:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:progressGlint 2.7s linear infinite}
.save-hint{transition:color .25s}
.story-meta span:first-child:before{content:"◦ ";color:#8bd8ff}
@keyframes cinemaIn{from{opacity:0;transform:translateY(13px) scale(.995);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes frameIn{from{filter:brightness(.65) saturate(.7)}to{filter:brightness(1) saturate(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes lightSweep{from{translate:-6% 0;opacity:.45}to{translate:7% 0;opacity:.9}}
@keyframes memoryAppear{from{opacity:0;transform:translateY(8px);box-shadow:0 0 0 rgba(80,170,240,0)}to{opacity:1;transform:translateY(0);box-shadow:0 7px 22px rgba(0,0,0,.22)}}
@keyframes memoryPulse{0%,100%{opacity:.65;box-shadow:0 0 7px rgba(101,199,255,.42)}50%{opacity:1;box-shadow:0 0 13px rgba(101,199,255,.9)}}
@keyframes progressGlint{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media(max-width:430px){.shell{padding-left:16px;padding-right:16px}.top{font-size:9px;letter-spacing:.11em}.chapter-label{font-size:9px}.sound-toggle{margin-left:auto}p{font-size:17px;line-height:1.62}}
@media(prefers-reduced-motion:reduce){section.fade,section.fade .frame,section.fade .kicker,section.fade h1,section.fade p,section.fade .actions button,section.fade>button,.memory-signal,.memory-signal::after,.progress span:after{animation:none!important}button,.frame,.progress span{transition:none!important}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="shell">
  <header class="top"><span class="brand-label"><i class="dot"></i>Интерактивная история</span><span class="chapter-label" id="chapterLabel">Часть I · Август</span><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" onclick="toggleSound()">ЗВУК · ВЫКЛ</button></header>
  <main id="app" aria-live="polite"></main>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>

</div>
<script>
const scenes = {
  cover: {
    chapter:"Пролог · Последнее лето",
    title:"АМПЛИТУДА <span>95</span>",
    vibe:"home", stamp:"Северск → юг России",
    text:[
      "Школа позади. Сибирское лето уже выдыхается, а впереди — август, море и последний учебный год перед взрослой жизнью.",
      "Тогда казалось, что самое интересное вот-вот начнётся. В поездку я ехал с друзьями и почти не представлял, каким вернусь обратно."
    ],
    note:"Первая глава интерактивной адаптации. Главные события остаются верны книге; выборы меняют фокус воспоминаний.",
    choices:[
      {label:"Думать о море и свободе",next:"moscow",set:{lens:"sea"}},
      {label:"Держаться за компанию — пока мы вместе",next:"moscow",set:{lens:"friends"}}
    ]
  },
  moscow: {
    chapter:"Глава 01 · Москва",
    title:"Розовое <span>солнце.</span>",
    vibe:"city",stamp:"Москва · ожидание поезда",
    text:[
      "Сначала был перелёт в Москву, торговый центр и соломенные шляпы. Полчаса задержки — и сопровождающая уже устраивает скандал, хотя до поезда ещё около шести часов.",
      "На газоне в центре города всё равно хорошо. Огромная Москва живёт на скорости, и мне хочется задержаться в этой атмосфере подольше. Но море манит не меньше."
    ],
    choices:[
      {label:"Запомнить город и не портить себе ожидание",next:"train",set:{moscow:"wonder"}},
      {label:"Отмахнуться от скандала: впереди ещё целое лето",next:"train",set:{moscow:"friction"}}
    ]
  },
  train: {
    chapter:"Глава 02 · Дорога",
    title:"Двое суток <span>лета.</span>",
    vibe:"train",stamp:"Плацкарт · Москва — Анапа",
    text:[
      "В вагоне жарко так, будто воздух забыли поменять. Колёса стучат, тело проваливается в сон, а после пробуждения возвращаются сухость во рту и головная боль.",
      "На маленьких станциях мы обливаемся ледяной водой, фотографируемся, едим варёную кукурузу. Время тянется, а юг медленно приближается."
    ],
    choices:[
      {label:"Мечтать о том, что ждёт впереди",next:"guest",set:{train:"dream"}},
      {label:"Считать станции и переживать саму дорогу",next:"guest",set:{train:"now"}}
    ]
  },
  guest: {
    chapter:"Глава 03 · Прибытие",
    title:"Добро пожаловать <span>в отпуск.</span>",
    vibe:"guest",stamp:"Витязево · гостевой дом",
    text:[
      "Море близко — так обещали. Сначала, правда, надо поселиться. Комната на троих едва вмещает чемоданы; вентилятора нет, душ общий, а туалет отделён от свиного хлева сеткой-рабицей.",
      "Всё это совсем не похоже на воображаемый отдых. Единственным местом, где можно спокойно посидеть, оказывается общая кухня: плетёная мебель, навес от солнца, собака, фрукты и чужая бытовая жизнь."
    ],
    choices:[
      {label:"Задержаться на кухне и немного выдохнуть",next:"kitchen",set:{guest:"refuge"}},
      {label:"Скинуть вещи — и сразу к морю",next:"road",set:{guest:"rush"}}
    ]
  },
  kitchen: {
    chapter:"Глава 03 · Маленькое убежище",
    title:"Островок <span>нормальности.</span>",
    vibe:"kitchen",stamp:"Общая кухня",
    text:[
      "Среди плесени, жары и неудобств эта кухня почему-то кажется живой. Тут кто-то разговаривает об экскурсиях, кто-то режет фрукты, ребёнок носится по двору.",

    choices:[{label:"Ладно. Теперь — к морю",next:"road",set:{kitchen:"saw_good"}}]
  },
  road: {
    chapter:"Глава 04 · «Шаговая доступность»",
    title:"Всего-то <span>час пешком.</span>",
    vibe:"road",stamp:"Болото · свалка · рынок",
    text:[
      "Дорога до моря превращается в отдельное испытание: заросшее болото, свалка строительного мусора и гнилых фруктов, рынок, шумные туристы и квартал дорогих отелей.",
      "Пыль во рту, натирающие тапки, голод и жара. Но мы всё равно идём — слишком долго представляли себе этот берег, чтобы повернуть назад за несколько сотен метров до него."
    ],
    choices:[
      {label:"Упереться: раз пришли — дойдём",next:"sea",set:{road:"push"}},
      {label:"Держаться за ожидание, пока хватает сил",next:"sea",set:{road:"hope"}}

  },
  sea: {
    chapter:"Глава 05 · Первый берег",
    title:"А море — <span>прекрасное.</span>",
    vibe:"sea",stamp:"Первые числа августа",
    text:[
      "И вот оно. Вода идеальной температуры, солнце рассыпается бликами по волнам, прохладные камни под ногами. Солёная вода щиплет мелкие ранки, но теперь солнце не выжимает из тебя последние силы — оно просто греет лицо.",

  },
  days: {
    chapter:"Глава 06 · Несовпадение",
    title:"Месяц — <span>слишком долго.</span>",
    vibe:"tension",stamp:"Витязево · следующие дни",
    text:[
      "После первых дней напряжение растёт. Скандалы сопровождающей, быт и постоянное желание уйти из гостевого дома постепенно съедают остатки радости.",

    ],
    choices:[
      {label:"Собрать деньги и выбраться раньше срока",next:"decision",set:{days:"decisive"}},
      {label:"Обсудить с Мишей всё ещё раз — и всё-таки уехать",next:"decision",set:{days:"together"}}
    ]
  },
  decision: {
    chapter:"Глава 07 · Решение",
    title:"Повернуть <span>рычаг.</span>",
    vibe:"tension",stamp:"Билеты на ближайшую пятницу",
    text:[
      "Мы покупаем билеты и оставшиеся два дня проводим подальше от гостевого дома. В Анапе торговый центр кажется почти другим миром. Появляется даже мысль: может, просто сделать вид, что отпуск был прекрасным?",

    ],
    choices:[
      {id:"decision_firm",label:"Принять последствия и не отступать",next:"departure",set:{decision:"firm"},signal:"Миша запомнит, что однажды решение всё-таки зависело от него."},
      {id:"decision_guilt",label:"Признать стыд за потраченные деньги — и всё равно уехать",next:"departure",set:{decision:"guilt"},signal:"Некоторые решения не заканчиваются в тот момент, когда их принимаешь."}
    ]

  try{graph.master.gain.cancelScheduledValues(now);graph.master.gain.setValueAtTime(Math.max(.0001,graph.master.gain.value),now);graph.master.gain.setTargetAtTime(.0001,now,.28);}catch(e){}
  graph.stopNodes.forEach(node=>{try{node.stop(now+seconds);}catch(e){}});
}
function stopSceneAtmosphere(){
  if(!ambientGraph||!audioContext)return;
  const old=ambientGraph;ambientGraph=null;fadeOutGraph(old,1.3);
}
function playSceneAtmosphere(vibe){
  if(!soundEnabled){stopSceneAtmosphere();return;}
  const ctx=getAudioContext();if(!ctx)return;
  vibe=vibe||'home';if(ambientGraph&&ambientGraph.vibe===vibe)return;
  const profiles={
    sea:{type:'lowpass',cutoff:1550,q:.38,volume:.031,modFreq:.095,modDepth:.42},
    road:{type:'lowpass',cutoff:1150,q:.42,volume:.024,modFreq:.075,modDepth:.26},
    train:{type:'lowpass',cutoff:640,q:.35,volume:.022,modFreq:.13,modDepth:.10},
    flight:{type:'lowpass',cutoff:520,q:.4,volume:.021,modFreq:.045,modDepth:.12},
    city:{type:'bandpass',cutoff:730,q:.25,volume:.015,modFreq:.055,modDepth:.36},
    guest:{type:'lowpass',cutoff:1000,q:.4,volume:.014,modFreq:.035,modDepth:.10},
    kitchen:{type:'lowpass',cutoff:1250,q:.35,volume:.012,modFreq:.04,modDepth:.08},
    home:{type:'lowpass',cutoff:620,q:.35,volume:.012,modFreq:.03,modDepth:.08},
    tension:{type:'lowpass',cutoff:420,q:.45,volume:.009,modFreq:.07,modDepth:.12},
    end:{type:'lowpass',cutoff:360,q:.4,volume:.011,modFreq:.025,modDepth:.10}
  };
  const p=profiles[vibe]||profiles.home;
  if(ambientGraph){const old=ambientGraph;ambientGraph=null;fadeOutGraph(old,1.4);}
  try{
    const graph=makeGraph();graph.vibe=vibe;graph.master=ctx.createGain();graph.master.gain.setValueAtTime(.0001,ctx.currentTime);graph.master.connect(ctx.destination);
    ambientGraph=graph;
    addNoiseLayer(ctx,graph,{vibe,type:p.type,cutoff:p.cutoff,q:p.q,volume:p.volume,modFreq:p.modFreq,modDepth:p.modDepth});
    // Scene-specific layers make the sound feel like a place, not generic white noise.
    if(vibe==='sea'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:290,q:.55,volume:.0065,modFreq:.085,modDepth:.58});
    }else if(vibe==='train'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:260,q:.5,volume:.009,modFreq:.12,modDepth:.12});
      addBufferLayer(ctx,graph,makeTrainRhythmBuffer(ctx),{type:'lowpass',cutoff:1550,volume:.0075});
      addToneLayer(ctx,graph,{freq:49,wave:'triangle',cutoff:180,volume:.0010,wobble:.12,wobbleDepth:1.6});
    }else if(vibe==='flight'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:230,q:.5,volume:.0085,modFreq:.035,modDepth:.09});
      addToneLayer(ctx,graph,{freq:56,wave:'triangle',cutoff:180,volume:.0022,wobble:.07,wobbleDepth:1.2});
      addToneLayer(ctx,graph,{freq:112,wave:'sine',cutoff:260,volume:.00055});
    }else if(vibe==='city'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:280,q:.5,volume:.0065,modFreq:.045,modDepth:.3});
      addToneLayer(ctx,graph,{freq:93,wave:'triangle',cutoff:220,volume:.00075,wobble:.055,wobbleDepth:5});
    }else if(vibe==='road'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:300,q:.6,volume:.007,modFreq:.07,modDepth:.2});
      addToneLayer(ctx,graph,{freq:54,wave:'triangle',cutoff:180,volume:.0016,wobble:.11,wobbleDepth:3.3});
    }else if(vibe==='tension'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:230,q:.6,volume:.004,modFreq:.065,modDepth:.08});
      addBufferLayer(ctx,graph,makeHeartbeatBuffer(ctx,72),{type:'lowpass',cutoff:155,volume:.016});
    }else if(vibe==='guest'||vibe==='kitchen'||vibe==='home'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:1750,q:.4,volume:.0035,modFreq:.027,modDepth:.08});
      if(vibe==='kitchen')addToneLayer(ctx,graph,{freq:50,wave:'sine',cutoff:130,volume:.00038});
      if(vibe==='home')addToneLayer(ctx,graph,{freq:58,wave:'sine',cutoff:145,volume:.00030});
    }else if(vibe==='end'){
      addNoiseLayer(ctx,graph,{vibe,type:'lowpass',cutoff:210,q:.5,volume:.0042,modFreq:.025,modDepth:.1});
    }
    graph.master.gain.setTargetAtTime(.92,ctx.currentTime+.05,.42);
  }catch(e){if(ambientGraph)fadeOutGraph(ambientGraph,.3);ambientGraph=null;}
}
function toggleSound(){
  soundEnabled=!soundEnabled;
  try{localStorage.setItem('amp95_sound_v1',soundEnabled?'1':'0');}catch(e){}
  syncSoundButton();
  if(soundEnabled){const ctx=getAudioContext();if(ctx)playSceneAtmosphere((scenes[current]&&scenes[current].vibe)||'home');}
  else stopSceneAtmosphere();
}

const STORAGE_KEY="amp95_progress_v2";
const app=document.getElementById("app"), bar=document.getElementById("bar");
const tg=window.Telegram?.WebApp;
const cloud=tg?.CloudStorage;
let cloudWriteChain=Promise.resolve();
const totalScenes=Object.keys(scenes).length;
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function makeState(){return {version:2,current,visited,choicesState,choiceHistory,pendingSignal,updatedAt:Date.now()}}
function parseState(value){
  try{
    const s=typeof value==='string'?JSON.parse(value):value;
    if(!s||typeof s!=='object'||typeof s.current!=='string'||!(s.current in scenes))return null;
    return {version:2,current:s.current,visited:Array.isArray(s.visited)?s.visited.filter(x=>typeof x==='string'&&x in scenes):[],choicesState:s.choicesState&&typeof s.choicesState==='object'?s.choicesState:{},choiceHistory:Array.isArray(s.choiceHistory)?s.choiceHistory.slice(-100):[],pendingSignal:s.pendingSignal&&s.pendingSignal.scene===s.current&&typeof s.pendingSignal.text==='string'?s.pendingSignal:null,updatedAt:Number(s.updatedAt)||0};
  }catch(e){return null}
}
function cloudGet(key){return new Promise(resolve=>{
  if(!cloud?.getItem){resolve(null);return;}
  let done=false; const finish=v=>{if(!done){done=true;resolve(v)}};
  try{cloud.getItem(key,(err,value)=>finish(err?null:value||null));}catch(e){finish(null)}
  setTimeout(()=>finish(null),1200);
});}
function cloudSet(key,value){return new Promise(resolve=>{
  if(!cloud?.setItem){resolve(false);return;}
  let done=false; const finish=ok=>{if(!done){done=true;resolve(ok)}};
  try{cloud.setItem(key,value,err=>finish(!err));}catch(e){finish(false)}
  setTimeout(()=>finish(false),1200);
});}
function cloudRemove(key){return new Promise(resolve=>{
  if(!cloud?.removeItem){resolve(false);return;}
  let done=false;const finish=ok=>{if(!done){done=true;resolve(ok)}};
  try{cloud.removeItem(key,err=>finish(!err));}catch(e){finish(false)}
  setTimeout(()=>finish(false),1200);
});}
function applyState(s){current=s.current;visited=s.visited;choicesState=s.choicesState;choiceHistory=s.choiceHistory;pendingSignal=s.pendingSignal;}
function saveState(){
  const state=makeState();
  const localHint=document.getElementById('saveHint');
  if(localHint)localHint.textContent='Прогресс сохраняется автоматически';
  const raw=JSON.stringify(state);
  try{localStorage.setItem(STORAGE_KEY,raw);}catch(e){}
  try{sessionStorage.setItem('amp95_state',raw);}catch(e){}
  if(cloud?.setItem) {
    cloudWriteChain=cloudWriteChain.then(()=>cloudSet(STORAGE_KEY,raw)).then(ok=>{
      const hint=document.getElementById('saveHint');
      if(hint&&tg) hint.textContent=ok?'Прогресс сохранён в Telegram':'Прогресс сохранён на устройстве';
      return ok;
    });
  }
}
async function restoreState(){
  let local=null, legacy=null, cloudSaved=null;
  try{local=parseState(localStorage.getItem(STORAGE_KEY));}catch(e){}
  try{legacy=parseState(sessionStorage.getItem('amp95_state'));}catch(e){}
  cloudSaved=parseState(await cloudGet(STORAGE_KEY));
  const candidates=[local,legacy,cloudSaved].filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(candidates.length){applyState(candidates[0]);return true;}
  return false;
}
function getSceneText(id,s){
  const out=[...(s.text||[])];
  if(id==='ch2_start'){
    if(choicesState.grief==='escape')out.push('После той потери особенно хотелось выключить внутренний шум. Я ещё не понимал, что попытка ничего не чувствовать тоже может стать привычкой.');
    else if(choicesState.grief==='alone')out.push('Я остался наедине с болью, как часто и делал. Иногда казалось, что если не отворачиваться от неё, она рано или поздно станет понятнее.');
    if(choicesState.sea==='memory')out.push('Где-то рядом всё ещё хранилось воспоминание о море — о коротком настоящем счастье посреди плохой поездки. Оно не отменяло остального, но и не исчезало.');
    else if(choicesState.sea==='contrast')out.push('Тот берег остался в памяти контрастом: несколько минут счастья не сделали хорошей всю поездку. Я уже тогда понимал, насколько одно не похоже на другое.');
    if(choicesState.decision==='firm')out.push('В Витязево я хотя бы смог принять решение и уехать. На фоне всего остального это казалось доказательством, что я всё ещё могу сам выбирать направление.');
    else if(choicesState.decision==='guilt')out.push('Я выбрался из Витязево, но чувство вины за потраченные родительские деньги не исчезло вместе с обратным билетом. Иногда решение заканчивает одну проблему, но не все последствия.');
  }
  if(id==='ch2_routine'&&choicesState.chapterTwoApproach==='motion')out.push('Я чаще искал компанию и какое-нибудь движение. Тишина давала слишком много места мыслям, а движуха обещала хотя бы ненадолго забить их другим шумом.');
  if(id==='ch2_yezh'&&choicesState.control==='believe')out.push('Я по-прежнему верил, что в любой момент сумею остановиться и повернуть назад. Уверенность казалась доказательством контроля, хотя доказательством не была.');
  if(id==='ch2_yezh'&&choicesState.control==='doubt')out.push('Во мне уже жило сомнение, что я сам понимаю свои мотивы. Но признать это вслух и изменить поведение — совершенно разные вещи.');
  if(id==='ch2_arina'&&choicesState.yezh==='escape')out.push('Я слишком хотел вырваться из пустоты, чтобы спокойно оценивать людей и собственные причины тянуться к ним.');
  if(id==='ch2_arina'&&choicesState.yezh==='distance')out.push('Я убеждал себя, что могу держать дистанцию и сам выбирать, насколько близко подпускать людей. В реальности всё редко бывает настолько аккуратным.');
  if(id==='ch2_after'){
    if(choicesState.arina==='remember_help')out.push('Я запомнил, что Арина помогла. Не как красивый жест из кино — просто как поступок человека, который оказался рядом, когда это было нужно.');
    if(choicesState.arina==='remember_shame')out.push('Я сильнее зацепился за унижение и чужие взгляды, чем за помощь. Стыд умеет заглушать благодарность, особенно пока ты сам не понимаешь, что с тобой происходит.');
    if(choicesState.panicResponse==='shame')out.push('В тот момент меня больше всего занимало, кто всё это видел и что теперь обо мне подумают. Этот страх оказался громче здравого смысла.');
    if(choicesState.panicResponse==='help')out.push('Признать, что тебе нужна помощь, оказалось не красивым уроком, а единственным разумным выходом из момента, который я уже не контролировал.');
  }
  if(id==='ch5_network'){
    if(choicesState.moneyFeeling==='freedom')out.push('Первые деньги дали мне ощущение, что я наконец могу жить без постоянного «потом». Именно поэтому я так легко отодвигал на задний план то, откуда они взялись.');
    else if(choicesState.moneyFeeling==='warning')out.push('Я замечал тревогу с самого начала. Просто решил, что смогу привыкнуть к ней и не позволить ей мешать.');
  }
  if(id==='ch5_request'){
    if(choicesState.networkLens==='validation')out.push('Мне нравилось, что меня ищут. Я принимал это за признание, хотя на деле незнакомые люди просто видели во мне возможность получить желаемое.');
    else if(choicesState.networkLens==='fear')out.push('Я уже понимал, что ситуация становится шире меня самого. Но понимание не было тем же самым, что готовность остановиться.');
  }
  if(id==='ch5_agreement'){
    if(choicesState.requestLens==='commit')out.push('Я сосредоточился на обещании. Так было проще, чем признать, что само обещание уже завело меня дальше, чем я собирался идти.');
    else if(choicesState.requestLens==='scale')out.push('Я видел, что риск вырос. Но продолжал надеяться, что смогу отделить последствия от себя — словно они касались кого-то другого.');
  }
  if(id==='ch5_flight'){
    if(choicesState.tripLens==='purpose')out.push('Я связывал этот шаг с будущим, в котором всё должно было стать лучше. Тогда мне не приходило в голову, что ради будущего можно разрушить то, что у тебя есть сейчас.');
    else if(choicesState.tripLens==='impulse')out.push('Я не стал отвечать себе на неудобные вопросы. Когда от них отворачиваешься, решение начинает выглядеть проще, чем оно есть.');
  }
  if(id==='ch5_end'){
    if(choicesState.flightLens==='deny')out.push('Я сказал себе, что теперь всё просто должно пройти удачно. Это было не планирование. Это была надежда, переодетая в уверенность.');
    else if(choicesState.flightLens==='admit')out.push('Я признал страх хотя бы перед самим собой. Но даже честное признание не остановило меня — и в этом была самая неприятная часть.');
  }
  return out;
}
function continueEnding(){
  const result=choicesState.grief==="escape"
    ? "После такого хотелось, чтобы внутри наконец стало тихо. Но желание забыться не убирает боль — оно лишь открывает следующую дверь."
    : "Я всегда был ближе к тем, кто остаётся один на один с болью. Но даже если не бежать от неё, жить с ней всё равно придётся.";
  const memory=choicesState.lens==="friends"
    ? "Те, кто ехал рядом, останутся в памяти частью этого августа — со всеми ссорами, смешными моментами и решениями."
    : "Море действительно было прекрасным. Но один красивый кадр не делает счастливой всю историю.";
  return `<p>${result}</p><p>${memory}</p><div class="rule"></div><div class="kicker">Глава II · Первая трещина</div><p>Сентябрь. Одиннадцатый класс. Возвращение к обычной жизни — и человек, который появляется рядом именно тогда, когда внутри слишком много шума.</p><button class="primary" onclick="goTo('ch2_start')">Продолжить: глава II <span class="choice-mark">→</span></button><button class="secondary" onclick="restart()">Начать историю заново</button>`;
}
function finishChapterTwo(){
  let recap='';
  if(choicesState.arina==='remember_help') recap='Ты сохранил в памяти то, что Арина помогла. Эта деталь вернётся позже.';
  else if(choicesState.arina==='remember_shame') recap='Ты сильнее запомнил стыд и чужие взгляды. В следующих главах этот взгляд на прошлое ещё может отозваться.';
  const confidence=choicesState.control==='believe'?'Ты пока веришь, что можешь остановиться в любой момент.':choicesState.control==='doubt'?'Ты уже сомневаешься в собственном контроле, но пока не знаешь, что с этим делать.':'';
  return `<p>${recap}</p>${confidence?`<p>${confidence}</p>`:''}<div class="rule"></div><div class="kicker">Глава III · Октябрь</div><p>Твои решения сохранены. Продолжение начинается с промозглого октябрьского дня и знакомого предложения, на которое Миша уже однажды пожалел, что согласился.</p><button class="primary" onclick="goTo('ch3_start')">Продолжить: глава III <span class="choice-mark">→</span></button><button class="secondary" onclick="goTo('ch2_arina')">Пересмотреть сцену с Ариной</button><button class="secondary" onclick="restart()">Начать историю заново</button>`;
}
function render(id){
  current=id; const s=scenes[id];
  if(!s)return;
  if(!visited.includes(id)) visited.push(id);
  const topLabel=document.getElementById('chapterLabel');
  if(topLabel)topLabel.textContent=s.section||'Часть I · Август';
  const body=getSceneText(id,s).map(t=>`<p>${t}</p>`).join("");
  let controls="";
  if(s.ending==="part1") controls=continueEnding();
  else if(s.ending==="chapter2") controls=finishChapterTwo();
  else if(s.ending==="chapter3") controls=`<div class="rule"></div><button class="primary" onclick="goTo('ch4_start')">Продолжить: глава IV <span class="choice-mark">→</span></button><button class="secondary" onclick="goTo('ch3_start')">Перечитать главу III</button><button class="secondary" onclick="restart()">Начать историю заново</button>`;
  else if(s.ending==="chapter4") controls=`<div class="rule"></div><button class="primary" onclick="goTo('ch5_start')">Продолжить: глава V <span class="choice-mark">→</span></button><button class="secondary" onclick="goTo('ch4_start')">Перечитать главу IV</button><button class="secondary" onclick="restart()">Начать историю заново</button>`;
  else if(s.ending==="chapter5") controls=`<div class="rule"></div><p class="small">В следующей главе — Москва, дорога обратно и последствия, которые уже нельзя списать на случайность.</p><button class="primary" onclick="restart()">Начать историю заново</button><button class="secondary" onclick="goTo('ch5_start')">Перечитать главу V</button><button class="secondary" onclick="goTo('ch4_start')">Вернуться к главе IV</button>`;
  else {
    if(s.note) controls+=`<div class="note">${s.note}</div>`;
    controls+=`<div class="actions">${s.choices.map((c,i)=>`<button onclick="choose('${esc(c.next)}',${i})">${c.label}<span class="choice-mark">↗</span></button>`).join("")}</div>`;
  }
  const signal=pendingSignal&&pendingSignal.scene===id?`<div class="memory-signal" role="status">${esc(pendingSignal.text)}</div>`:"";
  app.innerHTML=`<section class="fade"><div class="frame" data-vibe="${s.vibe||'home'}"><span class="frame-stamp">${s.stamp||'Амплитуда 95'}</span></div><div class="kicker">${s.chapter}</div><h1>${s.title}</h1>${signal}${body}${controls}<div class="story-meta"><span>Сцена ${String(visited.length).padStart(2,'0')}</span><span>Прогресс сохраняется</span></div></section>`;
  bar.style.width=Math.min(100,visited.length/totalScenes*100)+"%";
  syncSoundButton();
  if(soundEnabled){if(signal)playCue('memory');else playCue('transition');playSceneAtmosphere(s.vibe||'home');}else stopSceneAtmosphere();
  saveState();
  window.scrollTo({top:0,behavior:"smooth"});
}
function choose(next,index){
  playCue('choice');
  try{tg?.HapticFeedback?.impactOccurred?.('light');}catch(e){}
  const s=scenes[current], selected=s?.choices?.[index];
  if(!selected||!(next in scenes))return;
  if(selected.set)Object.assign(choicesState,selected.set);
  choiceHistory.push({scene:current,choiceId:selected.id||`${current}:${index}`,label:selected.label,next,at:Date.now()});
  if(choiceHistory.length>20)choiceHistory=choiceHistory.slice(-20);
  pendingSignal=selected.signal?{scene:next,text:selected.signal}:null;
  render(next);
}
function goTo(next){if(!(next in scenes))return;pendingSignal=null;render(next);}
async function restart(){
  if(!confirm('Начать историю заново? Текущий прогресс и сохранённые решения будут удалены.'))return;
  current='cover';visited=[];choicesState={};choiceHistory=[];pendingSignal=null;
  try{localStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem('amp95_state');}catch(e){}
  if(cloud?.removeItem){await cloudWriteChain; await cloudRemove(STORAGE_KEY);}
  render('cover');
}
async function init(){
  syncSoundButton();
  if(tg){try{tg.ready();tg.expand();}catch(e){}}
  const restored=await restoreState();
  if(restored){
    render(current);
    const hint=document.getElementById('saveHint');
    if(hint)hint.textContent=cloud?'Прогресс сохранён · продолжение с места остановки':'Прогресс сохраняется на устройстве';
  }else render('cover');
}
document.addEventListener('pointerdown',()=>{if(soundEnabled){const ctx=getAudioContext();if(ctx)playSceneAtmosphere((scenes[current]&&scenes[current].vibe)||'home');}},{once:true,passive:true});
window.addEventListener('pagehide',()=>{saveState(); if(ambientGraph)fadeOutGraph(ambientGraph,.25);});
init();
</script>
