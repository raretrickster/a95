<head>
<meta charset="utf-8">

<title>Амплитуда 95 — интерактивный роман</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#11100f;--panel:#1b1918;--text:#f1e9df;--muted:#a99d91;--red:#bd443b;--line:#3a302c;--gold:#d5a878;--blue:#536a7d}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#3a211d 0%,#171312 36%,#0d0c0c 75%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
.shell{max-width:680px;min-height:100vh;margin:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font:10px/1.4 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px;box-shadow:0 0 13px #bd443b}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:25px 0 30px}
.frame{height:clamp(94px,26vw,145px);position:relative;overflow:hidden;border:1px solid #49332d;margin-bottom:26px;background:linear-gradient(115deg,#11100f 0%,#38211e 52%,#12100f 100%);isolation:isolate}
.frame:before{content:"";position:absolute;inset:-25%;background:repeating-linear-gradient(90deg,transparent 0 8%,rgba(255,220,182,.08) 8.2% 8.7%,transparent 9% 14%);transform:skewX(-15deg);animation:drift 14s linear infinite}
.frame:after{content:"";position:absolute;width:45%;height:200%;left:32%;top:-48%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(189,68,59,.22),transparent);filter:blur(8px)}
.frame[data-vibe="city"]{background:linear-gradient(180deg,#171b26 0%,#a45e42 57%,#1b1414 100%)}
.frame[data-vibe="train"]{background:linear-gradient(180deg,#23201e 0%,#7b4933 44%,#181210 100%)}
.frame[data-vibe="guest"]{background:linear-gradient(135deg,#65513d 0%,#25211c 37%,#0f1110 100%)}
.frame[data-vibe="kitchen"]{background:linear-gradient(135deg,#766a51 0%,#433d30 42%,#171511 100%)}
.frame[data-vibe="road"]{background:linear-gradient(175deg,#d7a06b 0%,#8c6545 26%,#44362b 57%,#161311 100%)}
.frame[data-vibe="sea"]{background:linear-gradient(175deg,#bd8c65 0%,#d2a16f 28%,#42596a 29%,#1d3542 58%,#111516 100%)}
.frame[data-vibe="tension"]{background:linear-gradient(135deg,#36221d,#141211 45%,#4b251f 100%)}
.frame[data-vibe="flight"]{background:linear-gradient(180deg,#080e1b,#16243b 46%,#bd714c 47%,#251713 75%,#090909 100%)}
.frame[data-vibe="home"]{background:linear-gradient(130deg,#25201d,#171413 50%,#301d1b)}
.frame[data-vibe="end"]{background:linear-gradient(140deg,#070707,#191413 48%,#4a1d1b 100%)}
.frame-stamp{position:absolute;bottom:11px;left:13px;z-index:1;color:#f0d8c1;font:9px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.kicker{font:10px Arial,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
h1{font-size:clamp(41px,12vw,76px);line-height:.91;letter-spacing:-.055em;margin:0 0 22px;font-weight:700}
h1 span{color:var(--red)}
h2{font-size:clamp(27px,7vw,39px);line-height:1.02;letter-spacing:-.035em;margin:0 0 20px}
p{font-size:18px;line-height:1.64;color:#ded2c7;margin:0 0 17px;white-space:pre-line}
.small{font:12px/1.6 Arial,sans-serif;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,var(--red),var(--line),transparent);margin:24px 0}
.actions{display:grid;gap:10px;margin-top:25px}
button{font:14px/1.4 Arial,sans-serif;cursor:pointer;border:1px solid #54413a;background:#211b19;color:var(--text);padding:15px 16px;text-align:left;transition:transform .15s,border-color .15s,background .15s;min-height:54px;width:100%;-webkit-tap-highlight-color:transparent}
button:hover,button:focus-visible{border-color:var(--red);background:#2b1c1a;outline:none}
button:active{transform:scale(.99)}
button.primary{background:var(--red);border-color:var(--red);font-weight:700;color:#fff;text-align:center}
button.primary:hover{background:#d05247}
button.secondary{text-align:center;background:transparent}
.choice-mark{float:right;color:var(--red);padding-left:10px}
.story-meta{display:flex;gap:15px;flex-wrap:wrap;margin-top:21px;font:10px Arial,sans-serif;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.pill{display:inline-block;border:1px solid #4c3931;padding:5px 8px;color:#cbb8a7;font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:0 0 15px}
 .note{border-left:2px solid var(--red);padding:2px 0 2px 14px;color:#b7a79a;font-size:15px;line-height:1.55;margin:18px 0}
.memory-signal{border-left:2px solid var(--red);padding:10px 13px;margin:0 0 20px;background:linear-gradient(90deg,rgba(189,68,59,.10),transparent);color:#d8b9aa;font-size:14px;line-height:1.5;font-style:italic}
.memory-signal::before{content:"ПАМЯТЬ · ";font:9px Arial,sans-serif;letter-spacing:.18em;color:var(--red);font-style:normal}
.reset-link{width:auto;min-height:0;padding:0;border:0;background:transparent;color:#8f8177;font:9px/1.5 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.reset-link:hover,.reset-link:focus-visible{background:transparent;color:#e0b2a7;border:0}
.footer-right{display:flex;align-items:flex-end;flex-direction:column;gap:5px;text-align:right}
.save-hint{font:9px/1.4 Arial,sans-serif;color:#9a8175;letter-spacing:.04em;text-transform:none}

.progress{height:2px;background:#352b27;margin-top:22px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--red);transition:width .4s}
.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;font:9px/1.5 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#776c63}
.fade{animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{from{transform:translateX(-12%) skewX(-15deg)}to{transform:translateX(12%) skewX(-15deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><span><i class="dot"></i>Интерактивная история</span><span>Часть I · Август</span></header>
  <main id="app" aria-live="polite"></main>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>

      "Впереди — октябрь, знакомый голос в телефоне и предложение, которое легче было принять на автомате, чем честно объяснить себе, почему стоит отказаться.",

let current="cover", visited=[], choicesState={}, choiceHistory=[], pendingSignal=null;
const STORAGE_KEY="amp95_progress_v2";
const app=document.getElementById("app"), bar=document.getElementById("bar");
const tg=window.Telegram?.WebApp;
const cloud=tg?.CloudStorage;
let cloudWriteChain=Promise.resolve();
const totalScenes=19;
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function makeState(){return {version:2,current,visited,choicesState,choiceHistory,pendingSignal,updatedAt:Date.now()}}
function parseState(value){
  try{
    const s=typeof value==='string'?JSON.parse(value):value;
    if(!s||typeof s!=='object'||typeof s.current!=='string'||!(s.current in scenes))return null;
    return {version:2,current:s.current,visited:Array.isArray(s.visited)?s.visited.filter(x=>typeof x==='string'&&x in scenes):[],choicesState:s.choicesState&&typeof s.choicesState==='object'?s.choicesState:{},choiceHistory:Array.isArray(s.choiceHistory)?s.choiceHistory.slice(-100):[],pendingSignal:s.pendingSignal&&s.pendingSignal.scene===s.current&&typeof s.pendingSignal.text==='string'?s.pendingSignal:null,updatedAt:Number(s.updatedAt)||0};
  }catch(e){return null}
}
function cloudGet(key){return new Promise(resolve=>{
  if(!cloud?.getItem){resolve(null);return;}
  let done=false; const finish=v=>{if(!done){done=true;resolve(v)}};
  try{cloud.getItem(key,(err,value)=>finish(err?null:value||null));}catch(e){finish(null)}
  setTimeout(()=>finish(null),1200);
});}
function cloudSet(key,value){return new Promise(resolve=>{
  if(!cloud?.setItem){resolve(false);return;}
  let done=false; const finish=ok=>{if(!done){done=true;resolve(ok)}};
  try{cloud.setItem(key,value,err=>finish(!err));}catch(e){finish(false)}
  setTimeout(()=>finish(false),1200);
});}
function cloudRemove(key){return new Promise(resolve=>{
  if(!cloud?.removeItem){resolve(false);return;}
  let done=false;const finish=ok=>{if(!done){done=true;resolve(ok)}};
  try{cloud.removeItem(key,err=>finish(!err));}catch(e){finish(false)}
  setTimeout(()=>finish(false),1200);
});}
function applyState(s){current=s.current;visited=s.visited;choicesState=s.choicesState;choiceHistory=s.choiceHistory;pendingSignal=s.pendingSignal;}
function saveState(){
  const state=makeState();
  const raw=JSON.stringify(state);
  try{localStorage.setItem(STORAGE_KEY,raw);}catch(e){}
  try{sessionStorage.setItem('amp95_state',raw);}catch(e){}
  if(cloud?.setItem) {
    cloudWriteChain=cloudWriteChain.then(()=>cloudSet(STORAGE_KEY,raw)).then(ok=>{
      const hint=document.getElementById('saveHint');
      if(hint&&tg) hint.textContent=ok?'Прогресс сохранён в Telegram':'Прогресс сохранён на устройстве';
      return ok;
    });
  }
}
async function restoreState(){
  let local=null, legacy=null, cloudSaved=null;
  try{local=parseState(localStorage.getItem(STORAGE_KEY));}catch(e){}
  try{legacy=parseState(sessionStorage.getItem('amp95_state'));}catch(e){}
  cloudSaved=parseState(await cloudGet(STORAGE_KEY));
  const candidates=[local,legacy,cloudSaved].filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(candidates.length){applyState(candidates[0]);return true;}
  return false;
}
function getSceneText(id,s){
  const out=[...(s.text||[])];
  if(id==='ch2_start'){
    if(choicesState.grief==='escape')out.push('После той потери особенно хотелось выключить внутренний шум. Я ещё не понимал, что попытка ничего не чувствовать тоже может стать привычкой.');
    else if(choicesState.grief==='alone')out.push('Я остался наедине с болью, как часто и делал. Иногда казалось, что если не отворачиваться от неё, она рано или поздно станет понятнее.');
    if(choicesState.sea==='memory')out.push('Где-то рядом всё ещё хранилось воспоминание о море — о коротком настоящем счастье посреди плохой поездки. Оно не отменяло остального, но и не исчезало.');
    else if(choicesState.sea==='contrast')out.push('Тот берег остался в памяти контрастом: несколько минут счастья не сделали хорошей всю поездку. Я уже тогда понимал, насколько одно не похоже на другое.');
    if(choicesState.decision==='firm')out.push('В Витязево я хотя бы смог принять решение и уехать. На фоне всего остального это казалось доказательством, что я всё ещё могу сам выбирать направление.');
    else if(choicesState.decision==='guilt')out.push('Я выбрался из Витязево, но чувство вины за потраченные родительские деньги не исчезло вместе с обратным билетом. Иногда решение заканчивает одну проблему, но не все последствия.');
  }
  if(id==='ch2_routine'&&choicesState.chapterTwoApproach==='motion')out.push('Я чаще искал компанию и какое-нибудь движение. Тишина давала слишком много места мыслям, а движуха обещала хотя бы ненадолго забить их другим шумом.');
  if(id==='ch2_yezh'&&choicesState.control==='believe')out.push('Я по-прежнему верил, что в любой момент сумею остановиться и повернуть назад. Уверенность казалась доказательством контроля, хотя доказательством не была.');
  if(id==='ch2_yezh'&&choicesState.control==='doubt')out.push('Во мне уже жило сомнение, что я сам понимаю свои мотивы. Но признать это вслух и изменить поведение — совершенно разные вещи.');
  if(id==='ch2_arina'&&choicesState.yezh==='escape')out.push('Я слишком хотел вырваться из пустоты, чтобы спокойно оценивать людей и собственные причины тянуться к ним.');
  if(id==='ch2_arina'&&choicesState.yezh==='distance')out.push('Я убеждал себя, что могу держать дистанцию и сам выбирать, насколько близко подпускать людей. В реальности всё редко бывает настолько аккуратным.');
  if(id==='ch2_after'){
    if(choicesState.arina==='remember_help')out.push('Я запомнил, что Арина помогла. Не как красивый жест из кино — просто как поступок человека, который оказался рядом, когда это было нужно.');
    if(choicesState.arina==='remember_shame')out.push('Я сильнее зацепился за унижение и чужие взгляды, чем за помощь. Стыд умеет заглушать благодарность, особенно пока ты сам не понимаешь, что с тобой происходит.');
    if(choicesState.panicResponse==='shame')out.push('В тот момент меня больше всего занимало, кто всё это видел и что теперь обо мне подумают. Этот страх оказался громче здравого смысла.');
    if(choicesState.panicResponse==='help')out.push('Признать, что тебе нужна помощь, оказалось не красивым уроком, а единственным разумным выходом из момента, который я уже не контролировал.');
  }
  return out;
}
function continueEnding(){
  const result=choicesState.grief==="escape"
    ? "После такого хотелось, чтобы внутри наконец стало тихо. Но желание забыться не убирает боль — оно лишь открывает следующую дверь."
    : "Я всегда был ближе к тем, кто остаётся один на один с болью. Но даже если не бежать от неё, жить с ней всё равно придётся.";
  const memory=choicesState.lens==="friends"
    ? "Те, кто ехал рядом, останутся в памяти частью этого августа — со всеми ссорами, смешными моментами и решениями."
    : "Море действительно было прекрасным. Но один красивый кадр не делает счастливой всю историю.";
  return `<p>${result}</p><p>${memory}</p><div class="rule"></div><div class="kicker">Глава II · Первая трещина</div><p>Сентябрь. Одиннадцатый класс. Возвращение к обычной жизни — и человек, который появляется рядом именно тогда, когда внутри слишком много шума.</p><button class="primary" onclick="goTo('ch2_start')">Продолжить: глава II <span class="choice-mark">→</span></button><button class="secondary" onclick="restart()">Начать историю заново</button><button class="secondary" onclick="GenShare()">Поделиться историей</button>`;
}
function finishChapterTwo(){
  let recap='';
  if(choicesState.arina==='remember_help') recap='Ты сохранил в памяти то, что Арина помогла. Эта деталь вернётся позже.';
  else if(choicesState.arina==='remember_shame') recap='Ты сильнее запомнил стыд и чужие взгляды. В следующих главах этот взгляд на прошлое ещё может отозваться.';
  const confidence=choicesState.control==='believe'?'Ты пока веришь, что можешь остановиться в любой момент.':choicesState.control==='doubt'?'Ты уже сомневаешься в собственном контроле, но пока не знаешь, что с этим делать.':'';
  return `<p>${recap}</p>${confidence?`<p>${confidence}</p>`:''}<div class="rule"></div><div class="kicker">Продолжение следует</div><p>Следующая глава продолжит историю с октября. Твои выборы сохранены — мы не начнём всё заново, когда добавим продолжение.</p><button class="primary" onclick="goTo('ch2_arina')">Пересмотреть сцену с Ариной</button><button class="secondary" onclick="restart()">Начать историю заново</button><button class="secondary" onclick="GenShare()">Поделиться историей</button>`;
}
function GenShare(){
  const url=location.href;
  if(window.Telegram?.WebApp?.openTelegramLink){window.Telegram.WebApp.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent('Амплитуда 95 — интерактивный роман'));}
  else if(navigator.share){navigator.share({title:'Амплитуда 95',text:'Интерактивная история по мотивам книги',url}).catch(()=>{});}
  else {const b=document.createElement('textarea');b.value=url;document.body.appendChild(b);b.select();try{document.execCommand('copy')}catch(e){}b.remove();}
}
function render(id){
  current=id; const s=scenes[id];
  if(!s)return;
  if(!visited.includes(id)) visited.push(id);
  const topLabel=document.querySelector('.top span:last-child');
  if(topLabel)topLabel.textContent=s.section||'Часть I · Август';
  const body=getSceneText(id,s).map(t=>`<p>${t}</p>`).join("");
  let controls="";
  if(s.ending==="part1") controls=continueEnding();
  else if(s.ending==="chapter2") controls=finishChapterTwo();
  else {
    if(s.note) controls+=`<div class="note">${s.note}</div>`;
    controls+=`<div class="actions">${s.choices.map((c,i)=>`<button onclick="choose('${esc(c.next)}',${i})">${c.label}<span class="choice-mark">↗</span></button>`).join("")}</div>`;
  }
  const signal=pendingSignal&&pendingSignal.scene===id?`<div class="memory-signal" role="status">${esc(pendingSignal.text)}</div>`:"";
  app.innerHTML=`<section class="fade"><div class="frame" data-vibe="${s.vibe||'home'}"><span class="frame-stamp">${s.stamp||'Амплитуда 95'}</span></div><div class="kicker">${s.chapter}</div><h1>${s.title}</h1>${signal}${body}${controls}<div class="story-meta"><span>Сцена ${String(visited.length).padStart(2,'0')}</span><span>Прогресс сохраняется</span></div></section>`;
  bar.style.width=Math.min(100,visited.length/totalScenes*100)+"%";
  saveState();
  window.scrollTo({top:0,behavior:"smooth"});
}
function choose(next,index){
  const s=scenes[current], selected=s?.choices?.[index];
  if(!selected||!(next in scenes))return;
  if(selected.set)Object.assign(choicesState,selected.set);
  choiceHistory.push({scene:current,choiceId:selected.id||`${current}:${index}`,label:selected.label,next,at:Date.now()});
  if(choiceHistory.length>20)choiceHistory=choiceHistory.slice(-20);
  pendingSignal=selected.signal?{scene:next,text:selected.signal}:null;
  render(next);
}
function goTo(next){if(!(next in scenes))return;pendingSignal=null;render(next);}
async function restart(){
  if(!confirm('Начать историю заново? Текущий прогресс и сохранённые решения будут удалены.'))return;
  current='cover';visited=[];choicesState={};choiceHistory=[];pendingSignal=null;
  try{localStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem('amp95_state');}catch(e){}
  if(cloud?.removeItem){await cloudWriteChain; await cloudRemove(STORAGE_KEY);}
  render('cover');
}
async function init(){
  if(tg){try{tg.ready();tg.expand();}catch(e){}}
  const restored=await restoreState();
  if(restored){
    render(current);
    const hint=document.getElementById('saveHint');
    if(hint)hint.textContent=cloud?'Прогресс сохранён · продолжение с места остановки':'Прогресс сохраняется на устройстве';
  }else render('cover');
}
window.addEventListener('pagehide',saveState);
init();
</script>
